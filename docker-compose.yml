services:
  kama-marketplaces-backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: kama-marketplaces-backend
    env_file:
      - .env
    environment:
      TZ: 'Europe/Moscow'
    ports:
      - 127.0.0.1:5001:5001
    depends_on:
      - kama-marketplaces-postgres
    restart: unless-stopped
    networks:
      - default
      - dnet

  kama-marketplaces-postgres:
    container_name: kama-marketplaces-postgres
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATA: /var/lib/postgresql/data
    ports:
      - 127.0.0.1:5450:5432
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
      - dnet

volumes:
  pgdata:

networks:
  dnet:
    name: dnet
